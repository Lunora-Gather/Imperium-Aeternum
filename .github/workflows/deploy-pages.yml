name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build stable release
    runs-on: macos-latest
    outputs:
      files: ${{ steps.fingerprint.outputs.files }}
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release candidate gate
        env:
          VITE_BASE: /Imperium-Aeternum/
        run: npm run rc:check

      - run: sudo safaridriver --enable
      - name: Smoke test the built Pages candidate
        run: npm run test:e2e -- --preview

      - name: Copy SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Fingerprint files before upload
        id: fingerprint
        run: |
          files=$(node scripts/verify-production.mjs --manifest dist)
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: macos-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v7

      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify public deployment against the uploaded candidate
        env:
          PRODUCTION_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_PAGES_FILES: ${{ needs.build.outputs.files }}
        run: node scripts/verify-production.mjs
      - run: npm ci
      - run: sudo safaridriver --enable
      - name: Browser smoke test public deployment
        env:
          E2E_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run test:e2e
